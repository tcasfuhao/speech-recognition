# Raw input
raw_dir: "./data/raw"
out_dir: "./data/processed"

# Tier selection
include_tier_regex: null
exclude_tier_regex: null

# Segment limits
min_dur_ms: 200
max_dur_ms: 30000

# Text normalization
lowercase: true
strip_punct: true
keep_apostrophe: false
remove_bracketed: true
remove_diacritics: false
collapse_whitespace: true
normalize_quotes: true
map_numeric_speaker_codes: true

# Session ID mapping (used in metadata + optional group split)
session_id_from: "parent_dir"

# Audio extensions to consider
audio_exts: [".wav", ".mp3", ".mp4", ".m4a", ".flac"]

# 80/10/10 split (row-level by default)
split_by_col: null
split_seed: 42
train_ratio: 0.8
dev_ratio: 0.1
test_ratio: 0.1
allow_row_fallback: true
