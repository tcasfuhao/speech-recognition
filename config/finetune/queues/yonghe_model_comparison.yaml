queue_name: yonghe_model_comparison
stop_on_failure: true

# These paths are relative to this queue file. All five jobs use independent
# pretrained checkpoints and run sequentially in the order below.
jobs:
  - name: mms_ctc
    config: ../ctc/finetune_cer90.yaml
  - name: xlsr_ctc
    config: ../ctc/xlsr_cer90.yaml
  - name: ipa_whisper_base
    config: ../whisper/ipa_whisper_base_cer90.yaml
  - name: whisper_large_v3
    config: ../seq2seq/finetune_cer90.yaml
  - name: granite_speech
    config: ../granite/granite_speech_cer90.yaml
