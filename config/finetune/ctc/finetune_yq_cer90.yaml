# Data (CER-filtered: top 10% highest CER removed)
metadata: "./data/processed/metadata_cer90.csv"
audio_root: "./data/processed"
train_csv: "./data/processed/splits_cer90/train.csv"
dev_csv: "./data/processed/splits_cer90/dev.csv"
test_csv: "./data/processed/splits_cer90/test.csv"

# Model
model_id: "facebook/mms-1b-all"
# model_id: "facebook/wav2vec2-xlsr-53-espeak-cv-ft"
## model_id: "google/byt5-small"
# model_id: "mrfakename/Ministral-3-3B-Base-2512-Llamafied-TextOnly"
# model_id: "microsoft/VibeVoice"
# model_id: "vinai/xphonebert-base"

# Training
train_seed: 42
batch_size: 1
eval_batch_size: 1
grad_accum_steps: 8
epochs: 100
lr: 0.00005
patience: 20
warmup_steps: 100
fp16: true

# Output
out_dir: "./data/processed/asr/finetune"
