# Data
metadata: "./data/processed/metadata.csv"
audio_root: "./data/processed"
train_csv: "./data/processed/splits/train.csv"
dev_csv: "./data/processed/splits/dev.csv"
test_csv: "./data/processed/splits/test.csv"

# Model
model_id: "facebook/mms-1b-all"

# Training
train_seed: 42
batch_size: 1
eval_batch_size: 1
grad_accum_steps: 8
epochs: 25
lr: 0.00005
patience: 5
warmup_steps: 100
fp16: true

# Output
out_dir: "./data/processed/asr/finetune"
