# Model
backend: "ctc"
model_id: "facebook/mms-1b-all"

# Training
remove_spaces: true # Set to false to train word-boundary spaces
train_seed: 42
batch_size: 1
eval_batch_size: 1
grad_accum_steps: 8
epochs: 25
lr: 0.00005
patience: 5
warmup_steps: 100
fp16: true

# Output
out_dir: "~/projects/my-projects/asr-models/language-downloads/yonghe-qiang_01/processed/asr/ctc/mms"
