# Data (CER-filtered: top 10% highest CER removed)
metadata: "./logs/prep/yonghe_qiang/cer90/metadata.csv"
audio_root: "~/projects/my-projects/asr-models/language-downloads/yonghe-qiang_01/processed/splits"
train_csv: "./logs/prep/yonghe_qiang/cer90/splits/train.csv"
dev_csv: "./logs/prep/yonghe_qiang/cer90/splits/dev.csv"
test_csv: "./logs/prep/yonghe_qiang/cer90/splits/test.csv"

# Model
backend: "whisper"
model_id: "openai/whisper-large-v3"
lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "v_proj"]
gradient_checkpointing: true

# Training
remove_spaces: true # Set to false to train word-boundary spaces
train_seed: 42
batch_size: 1
eval_batch_size: 1
grad_accum_steps: 8
epochs: 50
lr: 0.00005
patience: 10
warmup_steps: 100
fp16: false
bf16: true
# Optional: set `language` to enable forced decoder prompts (Whisper processors)
# e.g. language: "zh" or language: "en"
# language: "IPA"

# Seq2Seq / generation settings
task: "transcribe"
generation_max_length: 256

# Output
out_dir: "~/projects/my-projects/asr-models/language-downloads/yonghe-qiang_01/processed/asr/whisper/whisper-large-v3"
