# Data
# metadata: "./logs/prep/yonghe_qiang_01_20260731_175902/metadata.csv"
# audio_root: "~/projects/my-projects/asr-models/language-downloads/yonghe-qiang_01/processed/splits"
# train_csv: "./logs/prep/yonghe_qiang_01_20260731_175902/splits/train.csv"
# dev_csv: "./logs/prep/yonghe_qiang_01_20260731_175902/splits/dev.csv"
# test_csv: "./logs/prep/yonghe_qiang_01_20260731_175902/splits/test.csv"

## Data (CER-filtered: top 10% highest CER removed)
metadata: ./logs/prep/yonghe_qiang_01_20260731_175902/cer90/metadata.csv
audio_root: ~/projects/my-projects/asr-models/language-downloads/yonghe-qiang_01/processed/splits
train_csv: ./logs/prep/yonghe_qiang_01_20260731_175902/cer90/splits/train.csv
dev_csv: ./logs/prep/yonghe_qiang_01_20260731_175902/cer90/splits/dev.csv
test_csv: ./logs/prep/yonghe_qiang_01_20260731_175902/cer90/splits/test.csv

# Model
backend: whisper
model_id: "neurlang/ipa-whisper-base"

# Training
remove_spaces: true # Set to false to train word-boundary spaces
train_seed: 42
batch_size: 1
eval_batch_size: 1
grad_accum_steps: 8
epochs: 50
lr: 0.00005
patience: 10
warmup_steps: 100
bf16: true
fp16: false
freeze_encoder: false
gradient_checkpointing: true
task: transcribe
generation_max_length: 256

# Output
out_dir: ~/projects/my-projects/asr-models/language-downloads/yonghe-qiang_01/processed/asr/ipa-whisper-base
validation_dir: "./logs/validation/comparison/japhug/brackets"
